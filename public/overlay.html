<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamAI Co-Host — Apple Liquid Glass OBS Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      padding: 36px;
    }

    /* Apple Liquid Glass Overlay Capsule */
    .apple-overlay-capsule {
      max-width: 660px;
      width: 100%;
      background: rgba(22, 22, 26, 0.82);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      padding: 16px 22px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 40px rgba(94, 92, 230, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      display: flex;
      gap: 16px;
      align-items: center;
      opacity: 0;
      transform: translateY(25px) scale(0.96);
      transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
      pointer-events: none;
      position: relative;
      overflow: hidden;
    }

    .apple-overlay-capsule.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Apple Intelligence Glowing Orb */
    .siri-orb-container {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #64D2FF 0%, #AF52DE 50%, #FF375F 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      box-shadow: 0 0 25px rgba(175, 82, 222, 0.6);
      transition: transform 0.3s ease;
    }

    .speaking .siri-orb-container {
      animation: orb-pulse 0.75s infinite alternate ease-in-out;
    }

    @keyframes orb-pulse {
      0% { transform: scale(0.94); box-shadow: 0 0 15px rgba(100, 210, 255, 0.5); }
      100% { transform: scale(1.12); box-shadow: 0 0 35px rgba(255, 55, 95, 0.9); }
    }

    /* Ondas de sonido Apple Sound Wave */
    .sound-bars {
      position: absolute;
      bottom: -6px;
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 14px;
    }

    .sound-bar {
      width: 3px;
      height: 3px;
      background: #64D2FF;
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .speaking .sound-bar:nth-child(1) { animation: sound-bounce 0.4s infinite 0.1s alternate; }
    .speaking .sound-bar:nth-child(2) { animation: sound-bounce 0.4s infinite 0.2s alternate; }
    .speaking .sound-bar:nth-child(3) { animation: sound-bounce 0.4s infinite 0.3s alternate; }
    .speaking .sound-bar:nth-child(4) { animation: sound-bounce 0.4s infinite 0.15s alternate; }

    @keyframes sound-bounce {
      0% { height: 3px; }
      100% { height: 16px; }
    }

    .text-content {
      flex: 1;
      min-width: 0;
    }

    .header-line {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: rgba(235, 235, 245, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .target-pill {
      color: #64D2FF;
      font-weight: 700;
    }

    .subtitle-text {
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #FFFFFF;
      line-height: 1.35;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="apple-overlay-capsule" id="overlayWidget">
    <div class="siri-orb-container" id="orbContainer">
      <svg style="width: 22px; height: 22px; color: #fff;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
      <div class="sound-bars">
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
      </div>
    </div>
    <div class="text-content">
      <div class="header-line">
        <span id="overlayBotName">Aura</span> respondiendo a <span class="target-pill" id="overlayTargetName">Espectador</span>
      </div>
      <div class="subtitle-text" id="overlaySubtitle">
        ...
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const overlayWidget = document.getElementById('overlayWidget');
    const orbContainer = document.getElementById('orbContainer');
    const overlayBotName = document.getElementById('overlayBotName');
    const overlayTargetName = document.getElementById('overlayTargetName');
    const overlaySubtitle = document.getElementById('overlaySubtitle');

    let hideTimer = null;

    function showReply(targetName, replyText, botName = 'Aura') {
      overlayBotName.textContent = botName;
      overlayTargetName.textContent = targetName;
      overlaySubtitle.textContent = replyText;

      overlayWidget.classList.add('visible');
      overlayWidget.classList.add('speaking');

      if (hideTimer) clearTimeout(hideTimer);

      const duration = Math.max(4000, replyText.length * 85);

      hideTimer = setTimeout(() => {
        overlayWidget.classList.remove('speaking');
        overlayWidget.classList.remove('visible');
      }, duration);
    }

    let overlayAudio = null;

    function playOverlayAudio(url) {
      if (!url) return;
      try {
        if (overlayAudio) overlayAudio.pause();
        overlayAudio = new Audio(url);
        overlayAudio.play().catch(() => {});
      } catch (e) {}
    }

    socket.on('ai_reply', (data) => {
      showReply(data.originalMessage?.author || 'Espectador', data.replyText);
      if (data.audioPayload?.audioUrl) {
        playOverlayAudio(data.audioPayload.audioUrl);
      }
    });

    socket.on('play_audio_tts', (data) => {
      showReply(data.author || 'Espectador', data.text);
      if (data.audioPayload?.audioUrl) {
        playOverlayAudio(data.audioPayload.audioUrl);
      }
    });
  </script>
</body>
</html>
